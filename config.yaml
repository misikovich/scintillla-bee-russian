# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: bzz~

# Scintilla has a 4096-token context and gets confused by long histories
max_text: 2000
max_images: 0
max_messages: 8

use_plain_responses: true
allow_dms: true

# BeeLLM was trained on plain text; "<@ID>: " prefixes make her angry
prefix_user_ids: false

# BeeLLM's replies all start with a "[mood:level]" tag. Some messages (e.g. "put u in jar") make her end the
# reply before it starts, so nothing gets sent; starting the reply with "[" makes her always answer
response_prefill: "["

# Let other bots talk to her, but only when they @mention her in the message text
allow_bots: true
max_bot_replies_per_minute: 5

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

# BeeLLM only understands English: Russian messages are translated to English for her, and her replies
# to them back to Russian (needs use_plain_responses: true). Delete this block to turn translation off
translator:
  # Gemma 3 4B on a llama.cpp CUDA server (see docker-compose.yaml)
  base_url: http://localhost:8082/v1
  model: gemma-3-4b

providers:
  # llama-server running BeeLLM-2.0-12M-Mood.gguf (see docker-compose.yaml)
  bee:
    base_url: http://localhost:8081/v1

models:
  # Don't put "llama" in this name: llmcord would treat it as a vision model
  bee/scintilla:
    max_tokens: 200

# Leave empty: BeeLLM's chat template drops system messages anyway
system_prompt:
