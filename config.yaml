# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: bzz~

# Scintilla has a 4096-token context and gets confused by long histories
max_text: 2000
max_images: 0
max_messages: 8

use_plain_responses: true

# History reset: messages from before this time (ISO, UTC if no offset) are left out of every conversation, so she
# doesn't see her old replies. Delete the line to use the whole reply chain again
history_since: "2026-11-11T22:41:50+00:00"

# Seconds from her getting a message to her reply at the least, so she doesn't answer instantly; she shows "typing..."
# meanwhile. Slower replies aren't held up further. Plain responses only. 0 turns it off
min_reply_delay: 3
allow_dms: true

# BeeLLM was trained on plain text; "<@ID>: " prefixes make her angry
prefix_user_ids: false

# BeeLLM only (not bee_models): BeeLLM's replies all start with a "[mood:level]" tag. Some messages (e.g. "put u in jar") make her end the
# reply before it starts, so nothing gets sent; starting the reply with "[" makes her always answer
response_prefill: "["

# Let other bots talk to her, but only when they @mention her in the message text
allow_bots: true
max_bot_replies_per_minute: 5

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

# BeeLLM only understands English: Russian messages are translated to English for her, and her replies
# to them back to Russian (needs use_plain_responses: true). Delete this block to turn translation off
# Off since 2026-11-10 (the translator container is behind a compose profile now)
# translator:
#   # Gemma 3 4B on a llama.cpp CUDA server (see docker-compose.yaml)
#   base_url: http://localhost:8082/v1
#   model: gemma-3-4b

providers:
  # CLIProxyAPI on node-mbp (cliproxyapi.md in the Computers repo); DeepSeek through Mistral's API
  cliproxy:
    base_url: http://10.10.0.50:8317/v1
    api_key_env: CLIPROXY_API_KEY

  # llama-server running BeeLLM-2.0-12M-Mood.gguf (see docker-compose.yaml)
  bee:
    base_url: http://localhost:8081/v1

models:
  # The first model is the default (read at startup, so restart after reordering); /model switches, admins only.
  # Default since 2026-11-11: DeepSeek v4.1 Flash hosted by Mistral, through CLIProxyAPI, ~0.5 s. If node-mbp's proxy or
  # Mistral is down she doesn't answer. Mistral rejects fields it doesn't know (422 extra_forbidden)
  cliproxy/mistral/deepseek-v4-1-flash-1017:
    temperature: 0.7
    max_tokens: 150

  # Don't put "llama" in this name: llmcord would treat it as a vision model
  bee/scintilla:
    max_tokens: 200

# Models that get Scintilla's prompt and examples (bee.py); system_prompt and response_prefill are skipped for them
bee_models:
  - cliproxy/mistral/deepseek-v4-1-flash-1017

# Leave empty: BeeLLM's chat template drops system messages anyway
system_prompt:
