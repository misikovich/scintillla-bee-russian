# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: bzz~

# Short histories keep her on topic
max_text: 2000
# She sees images (DeepSeek v4.1 Flash takes them); older ones in the reply chain are sent again with every reply
max_images: 2
max_messages: 8

use_plain_responses: true

# History reset: messages from before this time (ISO, UTC if no offset) are left out of every conversation, so she
# doesn't see her old replies. Delete the line to use the whole reply chain again
history_since: "2026-11-11T22:41:50+00:00"

# Seconds from her getting a message to her reply at the least, so she doesn't answer instantly; she shows "typing..."
# meanwhile. Slower replies aren't held up further. Plain responses only. 0 turns it off
min_reply_delay: 3
allow_dms: true

# bee.py writes user turns as "Name: text" itself; "<@ID>: " prefixes would only add noise
prefix_user_ids: false

# Let other bots talk to her, but only when they @mention her in the message text
allow_bots: true
max_bot_replies_per_minute: 5

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

providers:
  # CLIProxyAPI on node-mbp (cliproxyapi.md in the Computers repo); DeepSeek through Mistral's API
  cliproxy:
    base_url: http://10.10.0.50:8317/v1
    api_key_env: CLIPROXY_API_KEY

  # OpenRouter, for image generation (imagegen:)
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

models:
  # The first model is the default (read at startup, so restart after reordering); /model switches, admins only.
  # Default since 2026-11-11: DeepSeek v4.1 Flash hosted by Mistral, through CLIProxyAPI, ~0.5 s. If node-mbp's proxy or
  # Mistral is down she doesn't answer. Mistral rejects fields it doesn't know (422 extra_forbidden)
  # ":vision" tells llmcord the model takes images (stripped before the API call)
  cliproxy/mistral/deepseek-v4-1-flash-1017:vision:
    temperature: 0.7
    max_tokens: 150

# Satellite ("dynamic context", satellite.py): before she answers, this model decides whether the newest message needs a
# web search; if so it summarizes the results into a note for her reply. Within `timeout` seconds or she answers without
# it. Delete the block to turn it off. Bee models only.
# search: tavily (TAVILY_API_KEY), exa (EXA_API_KEY) or searxng (the searxng service in docker-compose.yaml, no key)
satellite:
  model: cliproxy/mistral/deepseek-v4-1-flash-1017
  params: {}
  search: tavily
  search_api_key_env: TAVILY_API_KEY
  searxng_url: http://searxng:8080
  results: 5
  snippet_chars: 500
  timeout: 5

# Image generation (imagegen.py): when the satellite's router sees a request to draw (or to change a picture), `writer`
# (a vision model, low reasoning) writes the image prompt from the request, the chat and the attached pictures, `model`
# draws it (OpenRouter's Images API) and the picture goes with her reply. Text-to-image only: a change to a picture is a
# redraw from its description. Needs `satellite:`. Delete the block to turn it off. Bee models only.
imagegen:
  writer: cliproxy/mistral/deepseek-v4-1-flash-1017:vision
  writer_params:
    reasoning_effort: low
    max_tokens: 4000
  writer_timeout: 30
  model: openrouter/recraft/recraft-v4.1-flash-v2
  # tried first for every picture (free, 50 requests/day); when it fails (429 once those are used up) `model` draws,
  # silently. Delete the line to always use `model`
  free_model: openrouter/recraft/recraft-v4.1-flash-v2:free
  free_timeout: 20
  image_timeout: 60
  # used when the request names no style
  style: a hyperrealistic photo, real camera, real light, detailed skin, hair, fur and fabric textures, shallow depth of field.
  max_input_images: 2
  per_user_per_hour: 30

# Threatened with a slipper, swatter, jar, net or bug spray (the satellite's router decides), she sends this sound as a
# voice message instead of a text reply. Ogg/Opus with a .json next to it: `python voice.py sounds/panic.mp3` makes both.
# Needs `satellite:`. Delete the line to turn it off (she answers with text then). Bee models only
panic_sound: sounds/panic.ogg

# Viewer (viewer.py): a live page of each reply (chain, satellite, drawing, prompt, model, reply) and the log. Read at
# startup. host: 127.0.0.1 unless set (docker-compose sets VIEWER_HOST=0.0.0.0 and publishes the port on the host's
# 127.0.0.1 only; `tailscale serve` puts it on the tailnet). Delete the block to turn it off
viewer:
  port: 8770
  host_env: VIEWER_HOST
  # Every finished reply (all steps, data, timings, API calls with tokens, its log lines) to <dir>/turns-YYYY-MM-DD.jsonl,
  # every log line to log-YYYY-MM-DD.jsonl, pictures to images/; the page reloads from it after a restart. Never
  # deleted (chats included). `python viewer.py stats data 7` sums it up. Delete the line to stop recording
  record_dir: data

# Models that get Scintilla's prompt and examples (bee.py); system_prompt is skipped for them
bee_models:
  - cliproxy/mistral/deepseek-v4-1-flash-1017:vision

# Unused: bee_models get their system prompt from bee.py
system_prompt:
