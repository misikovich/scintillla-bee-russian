services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/app:ro

  # Web search for the satellite (satellite.py, `satellite:` in config.yaml); only the bot reaches it, no published port
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:ro
