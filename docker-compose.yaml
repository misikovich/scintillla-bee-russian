services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/app:ro
      # The viewer's recording (record_dir in config.yaml), the only writable path
      - ./data:/app/data
    # The viewer (viewer.py), on the host's loopback only
    environment:
      VIEWER_HOST: 0.0.0.0
    ports:
      - 127.0.0.1:8770:8770

  # Web search for the satellite (satellite.py, `satellite:` in config.yaml); only the bot reaches it, no published port
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:ro
